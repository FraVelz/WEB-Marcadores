name: Continuous Integration - CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "supabase/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.*"
      - "tsconfig.json"
      - "vitest.config.*"
      - "playwright.config.*"
      - "postcss.config.*"
      - "eslint.config.*"
      - "global.d.ts"
      - "knip.json"
      - "vercel.json"
      - "doctor.config.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "supabase/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.*"
      - "tsconfig.json"
      - "vitest.config.*"
      - "playwright.config.*"
      - "postcss.config.*"
      - "eslint.config.*"
      - "global.d.ts"
      - "knip.json"
      - "vercel.json"
      - "doctor.config.json"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E Playwright
        run: pnpm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_DEMO_MODE: "true"

      - name: React Doctor
        continue-on-error: true
        run: pnpm run react:doctor
        env:
          NEXT_PUBLIC_SITE_URL: https://web-marcadores.vercel.app
